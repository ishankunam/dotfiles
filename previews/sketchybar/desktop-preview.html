<div id="sketchybar-desktop-preview" aria-label="Grouped SketchyBar design">
  <div class="sk-desktop" aria-label="Grouped bar over the selected wallpaper">
    <div class="sk-wallpaper" aria-hidden="true"></div>
    <div class="sk-mount">
      <div class="sk-bar">
        <div class="sk-left">
          <div class="sk-spaces" role="group" aria-label="AeroSpace workspaces"></div>
          <div class="sk-app"><span class="sk-glyph" aria-hidden="true">&#xf054;</span><span class="sk-app-name"></span></div>
        </div>
        <div class="sk-right">
          <span class="sk-focus"></span>
          <div class="sk-clock"><span class="sk-glyph" aria-hidden="true">&#xf43a;</span><span class="sk-clock-value"></span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="sk-snapshot" role="status" aria-live="polite"></div>
</div>
<script type="application/json" id="sketchybar-preview-data">
<!-- PREVIEW_DATA -->
</script>
<style>
  @font-face { font-family: "Sketchybar Hack"; src: url("__HACK_FONT__") format("woff"); font-weight: 700; font-display: swap; }
  #sketchybar-desktop-preview {
    --sk-font: "Sketchybar Hack", "Hack Nerd Font", monospace;
    --sk-font-size: 14px; --sk-icon-size: 17px; --sk-height: 40px; --sk-radius: 12px; --sk-gap: 10px;
    --sk-accent: #3b9781; --sk-text: #ffffff; --sk-line: #585b7040; --sk-group-color: #282a36cc; --sk-group-height: 32px; --sk-blur: 30px;
    --sk-scale: 1; --sk-screen-width: 1920px; --sk-screen-height: 1080px; color-scheme: dark;
  }
  #sketchybar-desktop-preview .sk-desktop { position: relative; isolation: isolate; overflow: hidden; height: 330px; border-radius: 10px; background: #b8bfb0; font-family: var(--sk-font); font-size: var(--sk-font-size); font-weight: 700; color: var(--sk-text); }
  #sketchybar-desktop-preview .sk-wallpaper { position: absolute; inset: 0; z-index: -1; background-image: url("__MONET_IMAGE__"); background-size: cover; background-position: center; }
  #sketchybar-desktop-preview .sk-mount { position: relative; }
  #sketchybar-desktop-preview .sk-bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; height: var(--sk-height); box-sizing: border-box; margin: 8px 14px 0; }
  #sketchybar-desktop-preview .sk-left, #sketchybar-desktop-preview .sk-right, #sketchybar-desktop-preview .sk-app, #sketchybar-desktop-preview .sk-spaces, #sketchybar-desktop-preview .sk-clock { display: flex; align-items: center; min-width: 0; }
  #sketchybar-desktop-preview .sk-left { gap: var(--sk-gap); }
  #sketchybar-desktop-preview .sk-right { gap: 14px; flex-shrink: 0; }
  #sketchybar-desktop-preview .sk-spaces { gap: 6px; flex-shrink: 0; }
  #sketchybar-desktop-preview .sk-app { gap: 10px; overflow: hidden; }
  #sketchybar-desktop-preview .sk-app-name, #sketchybar-desktop-preview .sk-focus { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sketchybar-desktop-preview .sk-focus { max-width: 24ch; }
  #sketchybar-desktop-preview .sk-clock { gap: 8px; white-space: nowrap; flex-shrink: 0; }
  #sketchybar-desktop-preview .sk-glyph { font-size: var(--sk-icon-size); }
  #sketchybar-desktop-preview .sk-bar button { font: inherit; color: inherit; border: 0; background: transparent; appearance: none; padding: 0; }
  #sketchybar-desktop-preview .sk-space { min-width: 24px; height: 25px; border-radius: 5px; font-size: var(--sk-icon-size) !important; display: grid; place-items: center; }
  #sketchybar-desktop-preview .sk-space[aria-pressed="true"] { background: color-mix(in srgb, var(--sk-accent) 25%, transparent); }
  #sketchybar-desktop-preview .sk-spaces, #sketchybar-desktop-preview .sk-app, #sketchybar-desktop-preview .sk-right { height: var(--sk-group-height); box-sizing: border-box; padding: 0 8px; background: var(--sk-group-color); border: 1px solid var(--sk-line); border-radius: var(--sk-radius); backdrop-filter: blur(var(--sk-blur)); }
  #sketchybar-desktop-preview .sk-snapshot { margin-top: 8px; color: light-dark(#454c51, #b9bfc6); font: 12px -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5; color-scheme: light dark; }
  #sketchybar-desktop-preview [hidden] { display: none !important; }
  #sketchybar-desktop-preview[data-view="Screen proportions"] .sk-desktop { height: auto; aspect-ratio: var(--sk-aspect); border-radius: 0; }
  #sketchybar-desktop-preview[data-view="Screen proportions"] .sk-mount { width: var(--sk-screen-width); height: var(--sk-screen-height); transform: scale(var(--sk-scale)); transform-origin: top left; }
  @media (max-width: 880px) {
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-app { max-width: 110px; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-spaces { gap: 2px; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-space { min-width: 20px; }
  }
  @media (max-width: 740px) {
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-bar { height: auto; min-height: var(--sk-height); flex-wrap: wrap; gap: 8px; padding-top: 4px; padding-bottom: 4px; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-right { margin-left: auto; }
  }
  @media (max-width: 430px) {
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-left { flex-wrap: wrap; gap: 8px; width: 100%; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-spaces { flex-wrap: wrap; gap: 2px; max-width: 100%; height: auto; min-height: calc(var(--sk-height) - 8px); }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-app { max-width: 100%; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-right { gap: 10px; height: auto; min-height: calc(var(--sk-height) - 8px); max-width: 100%; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-focus { max-width: 12ch; }
  }
  @media (pointer: coarse) {
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-space { min-width: 44px; min-height: 44px; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-spaces { flex-wrap: wrap; height: auto; max-width: 100%; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-left { flex-wrap: wrap; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-bar { flex-wrap: wrap; height: auto; }
    #sketchybar-desktop-preview[data-view="Bar detail"] .sk-app, #sketchybar-desktop-preview[data-view="Bar detail"] .sk-right { height: auto; min-height: 44px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('sketchybar-desktop-preview');
  const data = JSON.parse(document.getElementById('sketchybar-preview-data').textContent);
  const state = { version: 3, height: data.config.height, fontSize: data.config.labelSize, gap: 10, radius: data.config.radius, accent: '#' + data.config.spaceColor.slice(4), scenario: 'Desktop snapshot', display: 'Landscape', view: 'Bar detail', workspaceScenario: 'Desktop snapshot', focusMode: 'Work', space: data.snapshot.focusedWorkspace };
  const choices = {scenario:['Desktop snapshot','Long app name'],display:['Landscape','Portrait'],view:['Bar detail','Screen proportions'],workspaceScenario:['Desktop snapshot','One workspace','Six workspaces'],focusMode:['Work','Do Not Disturb','Off','Unavailable']};
  const cssColor = argb => '#' + argb.slice(4) + argb.slice(2,4);
  root.style.setProperty('--sk-group-color',cssColor(data.config.groupColor));
  root.style.setProperty('--sk-line',cssColor(data.config.borderColor));
  root.style.setProperty('--sk-text',cssColor(data.config.textColor));
  root.style.setProperty('--sk-blur',data.config.blur + 'px');
  function restore(saved) {
    const values = (saved?.privateContent || saved?.modelContent || saved)?.sketchybarDesign;
    if (!values || values.version !== 3) return;
    for (const [key,min,max] of [['height',32,48],['fontSize',11,16],['gap',4,16],['radius',4,20]]) if (Number.isFinite(values[key])) state[key] = Math.max(min,Math.min(max,values[key]));
    if (/^#[0-9a-f]{6}$/i.test(values.accent || '')) state.accent = values.accent;
    for (const [key,options] of Object.entries(choices)) if (options.includes(values[key])) state[key] = values[key];
    if (typeof values.space === 'string') state.space = values.space;
  }
  restore(window.openai?.widgetState);
  function save() {
    if (!window.openai?.setWidgetState) return;
    const saved = {sketchybarDesign:{...state}};
    window.openai.setWidgetState({modelContent:saved,privateContent:saved}).catch(() => {});
  }
  function render() {
    root.dataset.view = state.view;
    for (const [name,value] of [['height',state.height],['font-size',state.fontSize],['gap',state.gap],['radius',state.radius]]) root.style.setProperty('--sk-' + name,value + 'px');
    root.style.setProperty('--sk-accent',state.accent); root.style.setProperty('--sk-icon-size',data.config.iconSize + 'px');
    root.style.setProperty('--sk-group-height',(data.config.groupHeight + state.height - data.config.height) + 'px');
    const display = data.displays.find(d => d.orientation === state.display);
    root.style.setProperty('--sk-screen-width',display.width + 'px'); root.style.setProperty('--sk-screen-height',display.height + 'px');
    root.style.setProperty('--sk-aspect',display.width + ' / ' + display.height); root.style.setProperty('--sk-scale',root.clientWidth / display.width);
    const spaces = state.workspaceScenario === 'One workspace' ? [data.snapshot.focusedWorkspace] : state.workspaceScenario === 'Six workspaces' ? ['1','2','3','4','5','6'] : data.snapshot.workspaces;
    if (!spaces.includes(state.space)) state.space = spaces[0];
    const group = root.querySelector('.sk-spaces');
    const key = JSON.stringify(spaces);
    if (group.dataset.source !== key) {
      group.replaceChildren(...spaces.map(id => {const b = document.createElement('button'); b.type = 'button'; b.className = 'sk-space cursor-interaction'; b.dataset.space = id; b.textContent = id; b.setAttribute('aria-label','Workspace ' + id); return b;}));
      group.dataset.source = key;
    }
    root.querySelectorAll('.sk-space').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.space === state.space)));
    const app = state.scenario === 'Long app name' ? 'Visual Studio Code: SketchyBar design workspace' : data.snapshot.frontApp;
    const label = root.querySelector('.sk-app-name'); label.textContent = app; label.dataset.tooltip = app;
    const focus = root.querySelector('.sk-focus');
    focus.hidden = state.focusMode === 'Off'; focus.textContent = state.focusMode === 'Unavailable' ? 'Focus unavailable' : state.focusMode;
    focus.setAttribute('aria-label',state.focusMode === 'Unavailable' ? 'Focus state unavailable' : 'Sample Focus: ' + state.focusMode);
    focus.dataset.tooltip = focus.textContent;
    root.querySelector('.sk-clock-value').textContent = data.snapshot.clock;
    const workspaceLabel = state.workspaceScenario === 'Desktop snapshot' ? spaces.length + ' AeroSpace workspaces' : 'Sample: ' + spaces.length + ' workspaces';
    const focusLabel = state.focusMode === 'Unavailable' ? 'Focus reading unavailable' : 'Sample Focus: ' + state.focusMode;
    root.querySelector('.sk-snapshot').textContent = `${display.name} · ${display.width} × ${display.height} · ${state.view} · ${workspaceLabel} · ${focusLabel}`;
  }
  root.addEventListener('click',event => {const space = event.target.closest('[data-space]'); if (space) {state.space = space.dataset.space; render(); save();}});
  window.addEventListener('openai:set_globals',event => {if (event.detail?.globals?.widgetState) {restore(event.detail.globals.widgetState);render();}});
  new ResizeObserver(render).observe(root); render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:() => {render();save();}});
    tweak.addSlider(state,'height',{label:'Bar height',min:32,max:48,unit:'px',reference:'bar.height'});
    tweak.addSlider(state,'fontSize',{label:'Text size',min:11,max:16,unit:'px',reference:'label.font.size'});
    tweak.addSlider(state,'gap',{label:'Item spacing',min:4,max:16,unit:'px',reference:'item.padding'});
    tweak.addSlider(state,'radius',{label:'Group corners',min:4,max:20,unit:'px',reference:'bracket.background.corner_radius'});
    tweak.addColorPicker(state,'accent',{label:'Selected workspace',reference:'space.background.color'});
    for (const [key,label] of [['display','Display'],['view','Preview scale'],['workspaceScenario','Workspace list'],['focusMode','Sample Focus'],['scenario','Application']]) tweak.addSelect(state,key,{label,options:choices[key],reference:'preview.' + key});
  }
})();
</script>
