<div id="sketchybar-design-lab" aria-label="Shared bar design settings">
  <div class="viz-carousel" aria-label="SketchyBar design directions">
    <section data-variant="Minimal" aria-label="Minimal bar design">
      <div class="sk-desktop" data-layout="minimal" aria-label="Simulated desktop with a minimal bar">
        <div class="sk-wallpaper" aria-hidden="true"></div>
        <div class="sk-notch" aria-hidden="true"></div>
        <div class="sk-mount"></div>
      </div>
    </section>
    <section data-variant="Floating" aria-label="Floating bar design" hidden>
      <div class="sk-desktop" data-layout="floating" aria-label="Simulated desktop with a floating bar">
        <div class="sk-wallpaper" aria-hidden="true"></div>
        <div class="sk-notch" aria-hidden="true"></div>
        <div class="sk-mount"></div>
      </div>
    </section>
    <section data-variant="Grouped" aria-label="Grouped bar design" hidden>
      <div class="sk-desktop" data-layout="grouped" aria-label="Simulated desktop with grouped bar sections">
        <div class="sk-wallpaper" aria-hidden="true"></div>
        <div class="sk-notch" aria-hidden="true"></div>
        <div class="sk-mount"></div>
      </div>
    </section>
  </div>
  <div class="sk-sample-note" role="status" aria-live="polite">Sample data · Space 2 · Battery 76%</div>
  <template id="sketchybar-item-template">
    <div class="sk-bar" aria-label="Bar appearance">
      <div class="sk-left">
        <div class="sk-spaces" role="group" aria-label="Sample Spaces">
          <button type="button" class="sk-space cursor-interaction" data-space="1" aria-label="Space 1" aria-pressed="false">1</button>
          <button type="button" class="sk-space cursor-interaction" data-space="2" aria-label="Space 2" aria-pressed="true">2</button>
          <button type="button" class="sk-space cursor-interaction" data-space="3" aria-label="Space 3" aria-pressed="false">3</button>
          <button type="button" class="sk-space cursor-interaction" data-space="4" aria-label="Space 4" aria-pressed="false">4</button>
        </div>
        <div class="sk-app" aria-label="Sample active application">
          <i data-lucide="terminal" aria-hidden="true"></i>
          <span class="sk-app-name">Codex</span>
        </div>
      </div>
      <div class="sk-right">
        <span class="sk-clock"><span class="sk-date">Sun Oct 11</span><span class="sk-time">9:41</span></span>
        <button type="button" class="sk-battery cursor-interaction" aria-label="Battery 76%, on battery power" aria-expanded="false">
          <span class="sk-battery-icon" aria-hidden="true"><span class="sk-battery-fill"></span></span>
          <span class="sk-battery-percent">76%</span>
        </button>
      </div>
    </div>
    <div class="sk-popup" role="dialog" aria-label="Sample battery details" hidden>
      <div class="sk-popup-header"><span>Battery</span><button type="button" class="sk-popup-close cursor-interaction" aria-label="Close battery details"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="sk-popup-value">76%</div>
      <div class="sk-popup-source">On battery power</div>
    </div>
  </template>
</div>
<style>
  #sketchybar-design-lab {
    --sk-accent: #3b9781;
    --sk-font-size: 13px;
    --sk-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --sk-height: 34px;
    --sk-gap: 10px;
    --sk-radius: 12px;
    --sk-notch-size: min(15cqw, 128px);
    color-scheme: light dark;
  }
  #sketchybar-design-lab .sk-desktop {
    --sk-text: light-dark(#202c31, #e7ecef);
    --sk-surface: light-dark(#faf9f6, #172128);
    --sk-line: light-dark(#d0d7d6, #364449);
    --sk-wall: light-dark(#d0d9d4, #15282e);
    --sk-haze: light-dark(#f0dcca, #4f766d);
    --sk-deep: light-dark(#708b80, #122326);
    --sk-shadow: light-dark(#183d3426, #00000040);
    --sk-left-inset: 14px;
    container-type: inline-size;
    position: relative;
    height: 286px;
    isolation: isolate;
    overflow: hidden;
    border-radius: 12px;
    background: var(--sk-wall);
    color: var(--sk-text);
    font-family: var(--sk-font);
    font-size: var(--sk-font-size);
    font-weight: 400;
  }
  #sketchybar-design-lab .sk-wallpaper {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 90% 0%, var(--sk-haze), transparent 75%), linear-gradient(145deg, var(--sk-wall), var(--sk-deep));
    z-index: -2;
  }
  #sketchybar-design-lab .sk-wallpaper::after {
    content: "";
    position: absolute;
    width: 125%;
    height: 170%;
    left: -30%;
    top: 32%;
    border-radius: 50%;
    background: linear-gradient(70deg, var(--sk-deep), color-mix(in srgb, var(--sk-haze) 38%, transparent));
    transform: rotate(-18deg);
  }
  #sketchybar-design-lab .sk-notch {
    width: var(--sk-notch-size);
    height: 25px;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 0 0 9px 9px;
    background: #090b0d;
    z-index: 5;
  }
  #sketchybar-design-lab .sk-mount { position: relative; }
  #sketchybar-design-lab .sk-bar {
    height: var(--sk-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    padding: 0 14px;
    background: color-mix(in srgb, var(--sk-surface) 90%, transparent);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--sk-line);
  }
  #sketchybar-design-lab .sk-left,
  #sketchybar-design-lab .sk-right,
  #sketchybar-design-lab .sk-app,
  #sketchybar-design-lab .sk-spaces,
  #sketchybar-design-lab .sk-clock,
  #sketchybar-design-lab .sk-battery {
    display: flex;
    align-items: center;
    gap: var(--sk-gap);
    min-width: 0;
  }
  #sketchybar-design-lab .sk-left { max-width: calc(50cqw - var(--sk-notch-size) / 2 - var(--sk-left-inset) - 8px); }
  #sketchybar-design-lab .sk-right { flex-shrink: 0; }
  #sketchybar-design-lab .sk-spaces { gap: 3px; flex-shrink: 0; }
  #sketchybar-design-lab .sk-bar button,
  #sketchybar-design-lab .sk-popup button {
    appearance: none;
    border: 0;
    color: inherit;
    font: inherit;
    background: transparent;
    padding: 0;
    flex-shrink: 0;
  }
  #sketchybar-design-lab .sk-space {
    height: calc(var(--sk-height) - 10px);
    width: 24px;
    display: grid;
    place-items: center;
    border-radius: 5px;
    font-variant-numeric: tabular-nums;
  }
  #sketchybar-design-lab .sk-space[aria-pressed="true"] {
    background: color-mix(in srgb, var(--sk-accent) 24%, transparent);
    font-weight: 500;
  }
  #sketchybar-design-lab .sk-space:hover,
  #sketchybar-design-lab .sk-battery:hover {
    background: color-mix(in srgb, var(--sk-accent) 15%, transparent);
  }
  #sketchybar-design-lab .sk-app { gap: 6px; overflow: hidden; }
  #sketchybar-design-lab .sk-app svg { width: 15px; height: 15px; flex-shrink: 0; }
  #sketchybar-design-lab .sk-app-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  #sketchybar-design-lab .sk-clock { gap: 10px; white-space: nowrap; }
  #sketchybar-design-lab .sk-time,
  #sketchybar-design-lab .sk-battery-percent { font-variant-numeric: tabular-nums; }
  #sketchybar-design-lab .sk-battery { gap: 6px; border-radius: 5px; height: calc(var(--sk-height) - 8px); }
  #sketchybar-design-lab .sk-battery-icon {
    position: relative;
    display: inline-block;
    width: 20px;
    height: 10px;
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 1px;
    box-sizing: border-box;
  }
  #sketchybar-design-lab .sk-battery-icon::after {
    position: absolute;
    content: "";
    width: 2px;
    height: 4px;
    top: 2px;
    right: -3px;
    border-radius: 0 1px 1px 0;
    background: currentColor;
  }
  #sketchybar-design-lab .sk-battery-fill {
    display: block;
    width: 76%;
    height: 100%;
    background: currentColor;
    border-radius: 1px;
  }
  #sketchybar-design-lab .sk-desktop[data-layout="floating"] { --sk-left-inset: 31px; }
  #sketchybar-design-lab .sk-desktop[data-layout="grouped"] { --sk-left-inset: 18px; }
  #sketchybar-design-lab .sk-desktop[data-layout="floating"] .sk-bar {
    margin: 12px 18px 0;
    padding: 0 12px;
    border: 1px solid var(--sk-line);
    border-radius: var(--sk-radius);
    box-shadow: 0 5px 20px var(--sk-shadow);
  }
  #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-bar {
    margin: 12px 18px 0;
    padding: 0;
    border: 0;
    background: transparent;
    backdrop-filter: none;
  }
  #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-spaces,
  #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-app,
  #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-right {
    box-sizing: border-box;
    height: var(--sk-height);
    padding: 0 9px;
    border: 1px solid var(--sk-line);
    border-radius: var(--sk-radius);
    background: color-mix(in srgb, var(--sk-surface) 90%, transparent);
    backdrop-filter: blur(18px);
    box-shadow: 0 4px 14px var(--sk-shadow);
  }
  #sketchybar-design-lab .sk-popup {
    position: absolute;
    right: 18px;
    top: calc(var(--sk-height) + 18px);
    z-index: 10;
    width: 190px;
    padding: 14px;
    box-sizing: border-box;
    color: var(--sk-text);
    background: var(--sk-surface);
    border: 1px solid var(--sk-line);
    border-radius: var(--sk-radius);
    box-shadow: 0 8px 24px var(--sk-shadow);
  }
  #sketchybar-design-lab .sk-popup-header { display: flex; align-items: center; justify-content: space-between; font-weight: 500; }
  #sketchybar-design-lab .sk-popup-close { display: grid; place-items: center; width: 28px; height: 28px; }
  #sketchybar-design-lab .sk-popup-close svg { width: 15px; height: 15px; }
  #sketchybar-design-lab .sk-popup-value { margin: 10px 0 5px; font-size: 22px; font-weight: 500; }
  #sketchybar-design-lab .sk-popup-source { font-size: 12px; }
  #sketchybar-design-lab .sk-sample-note { margin-top: 8px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; color: light-dark(#47555a, #afbdc4); }
  #sketchybar-design-lab [hidden] { display: none !important; }
  @media (max-width: 620px) {
    #sketchybar-design-lab .sk-date { display: none; }
    #sketchybar-design-lab .sk-bar { padding: 0 10px; }
    #sketchybar-design-lab .sk-app { max-width: 80px; }
    #sketchybar-design-lab .sk-space { width: 21px; }
    #sketchybar-design-lab .sk-desktop[data-layout="minimal"] { --sk-left-inset: 10px; }
    #sketchybar-design-lab .sk-desktop[data-layout="floating"] { --sk-left-inset: 19px; }
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] { --sk-left-inset: 10px; }
    #sketchybar-design-lab .sk-desktop[data-layout="floating"] .sk-bar { margin-left: 10px; margin-right: 10px; padding: 0 8px; }
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-bar { margin-left: 10px; margin-right: 10px; }
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-spaces,
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-app,
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-right { padding-left: 6px; padding-right: 6px; }
  }
  @media (max-width: 430px) {
    #sketchybar-design-lab .sk-left { max-width: none; gap: 4px; }
    #sketchybar-design-lab .sk-right { gap: 8px; }
    #sketchybar-design-lab .sk-space { width: 16px; }
    #sketchybar-design-lab .sk-app-name { display: none; }
    #sketchybar-design-lab .sk-bar { padding-left: 8px; padding-right: 8px; }
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-bar { margin-left: 8px; margin-right: 8px; }
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-app,
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-spaces,
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-right { padding-left: 4px; padding-right: 4px; }
  }
  @media (pointer: coarse) {
    #sketchybar-design-lab .sk-space { width: 44px; min-height: 44px; }
    #sketchybar-design-lab .sk-bar { min-height: 54px; }
    #sketchybar-design-lab .sk-battery { min-height: 44px; }
    #sketchybar-design-lab .sk-popup-close { min-width: 44px; min-height: 44px; }
    #sketchybar-design-lab .sk-app { display: none; }
    #sketchybar-design-lab .sk-notch { display: none; }
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-spaces,
    #sketchybar-design-lab .sk-desktop[data-layout="grouped"] .sk-right { min-height: 54px; }
    #sketchybar-design-lab .sk-popup { top: 72px; }
    #sketchybar-design-lab .sk-time { display: none; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('sketchybar-design-lab');
  const template = document.getElementById('sketchybar-item-template');
  const desktops = [...root.querySelectorAll('.sk-desktop')];
  desktops.forEach(desktop => desktop.querySelector('.sk-mount').append(template.content.cloneNode(true)));
  const defaults = { height: 34, fontSize: 13, gap: 10, radius: 12, accent: '#3b9781', notch: true, font: 'System', scenario: 'Normal', space: 2 };
  const state = { ...defaults };
  function applySaved(saved) {
    const source = saved && (saved.privateContent || saved.modelContent || saved);
    const values = source && source.sketchybarDesign;
    if (!values || values.version !== 1) return;
    ['height', 'fontSize', 'gap', 'radius'].forEach(key => {
      if (typeof values[key] === 'number' && Number.isFinite(values[key])) state[key] = values[key];
    });
    if (typeof values.accent === 'string' && /^#[0-9a-f]{6}$/i.test(values.accent)) state.accent = values.accent;
    if (typeof values.notch === 'boolean') state.notch = values.notch;
    if (['System', 'Monospace'].includes(values.font)) state.font = values.font;
    if (['Normal', 'Long app name', 'Low battery', 'Charging'].includes(values.scenario)) state.scenario = values.scenario;
    if ([1,2,3,4].includes(values.space)) state.space = values.space;
    state.height = Math.max(28, Math.min(44, state.height));
    state.fontSize = Math.max(11, Math.min(16, state.fontSize));
    state.gap = Math.max(4, Math.min(16, state.gap));
    state.radius = Math.max(4, Math.min(20, state.radius));
  }
  applySaved(window.openai?.widgetState);
  function save() {
    if (!window.openai?.setWidgetState) return;
    const saved = { sketchybarDesign: { version: 1, ...state } };
    window.openai.setWidgetState({ modelContent: saved, privateContent: saved }).catch(() => {});
  }
  function render() {
    root.style.setProperty('--sk-height', state.height + 'px');
    root.style.setProperty('--sk-font-size', state.fontSize + 'px');
    root.style.setProperty('--sk-gap', state.gap + 'px');
    root.style.setProperty('--sk-radius', state.radius + 'px');
    root.style.setProperty('--sk-accent', state.accent);
    root.style.setProperty('--sk-notch-size', state.notch ? 'min(15cqw, 128px)' : '0px');
    root.style.setProperty('--sk-font', state.font === 'Monospace' ? '"SFMono-Regular", Menlo, monospace' : '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif');
    const percent = state.scenario === 'Low battery' ? 8 : 76;
    const source = state.scenario === 'Charging' ? 'Charging · AC power' : 'On battery power';
    root.querySelectorAll('.sk-notch').forEach(el => { el.hidden = !state.notch; });
    root.querySelectorAll('.sk-app-name').forEach(el => { el.textContent = state.scenario === 'Long app name' ? 'Visual Studio Code — SketchyBar design workspace' : 'Codex'; el.dataset.tooltip = el.textContent; });
    root.querySelectorAll('.sk-space').forEach(el => { el.setAttribute('aria-pressed', String(Number(el.dataset.space) === state.space)); });
    root.querySelectorAll('.sk-battery-percent, .sk-popup-value').forEach(el => { el.textContent = percent + '%'; });
    root.querySelectorAll('.sk-battery-fill').forEach(el => { el.style.width = percent + '%'; });
    root.querySelectorAll('.sk-popup-source').forEach(el => { el.textContent = source; });
    root.querySelectorAll('.sk-battery').forEach(el => { el.setAttribute('aria-label', `Battery ${percent}%, ${source.toLowerCase()}`); });
    root.querySelector('.sk-sample-note').textContent = `Sample data · ${state.scenario} · Space ${state.space} · Battery ${percent}%`;
  }
  function closePopups() {
    root.querySelectorAll('.sk-popup').forEach(el => { el.hidden = true; });
    root.querySelectorAll('.sk-battery').forEach(el => { el.setAttribute('aria-expanded', 'false'); });
  }
  root.addEventListener('click', event => {
    const space = event.target.closest('[data-space]');
    if (space && root.contains(space)) {
      state.space = Number(space.dataset.space);
      render();
      save();
      return;
    }
    const battery = event.target.closest('.sk-battery');
    if (battery) {
      const popup = battery.closest('.sk-mount').querySelector('.sk-popup');
      const willOpen = popup.hidden;
      closePopups();
      popup.hidden = !willOpen;
      battery.setAttribute('aria-expanded', String(willOpen));
      if (willOpen) popup.querySelector('.sk-popup-close').focus();
      return;
    }
    const close = event.target.closest('.sk-popup-close');
    if (close) {
      const batteryControl = close.closest('.sk-mount').querySelector('.sk-battery');
      closePopups();
      batteryControl.focus();
    } else if (!event.target.closest('.sk-popup')) closePopups();
  });
  root.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    const visiblePopup = [...root.querySelectorAll('.sk-popup')].find(el => !el.hidden);
    if (!visiblePopup) return;
    const battery = visiblePopup.closest('.sk-mount').querySelector('.sk-battery');
    closePopups();
    battery.focus();
  });
  window.addEventListener('openai:set_globals', event => {
    const saved = event.detail?.globals?.widgetState;
    if (saved) { applySaved(saved); render(); }
  });
  render();
  if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () => { render(); save(); } });
    tweak.addSlider(state, 'height', { label: 'Bar height', min: 28, max: 44, unit: 'px', reference: 'bar.height' });
    tweak.addSlider(state, 'fontSize', { label: 'Text size', min: 11, max: 16, unit: 'px', reference: 'label.font.size' });
    tweak.addSlider(state, 'gap', { label: 'Item spacing', min: 4, max: 16, unit: 'px', reference: 'item.padding' });
    tweak.addSlider(state, 'radius', { label: 'Corner radius', min: 4, max: 20, unit: 'px', reference: 'bar.corner_radius' });
    tweak.addColorPicker(state, 'accent', { label: 'Active Space color', reference: 'space.highlight_color' });
    tweak.addToggle(state, 'notch', { label: 'Show sample notch', reference: 'preview.notch' });
    tweak.addSelect(state, 'font', { label: 'Font', options: ['System', 'Monospace'], reference: 'label.font.family' });
    tweak.addSelect(state, 'scenario', { label: 'Sample state', options: ['Normal', 'Long app name', 'Low battery', 'Charging'], reference: 'preview.scenario' });
  }
})();
</script>
